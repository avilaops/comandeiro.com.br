name: Cleanup integrated branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-reachable-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete internal branches already reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git for-each-ref --format='%(refname:short)' refs/remotes/origin | while read -r ref; do
            branch="${ref#origin/}"
            if [ "${branch}" = "HEAD" ] || [ "${branch}" = "${DEFAULT_BRANCH}" ]; then
              continue
            fi
            if git merge-base --is-ancestor "${ref}" "origin/${DEFAULT_BRANCH}"; then
              gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
